<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - نظام التنبؤ بالأرباح</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 420px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.10);
            border: 1px solid #e5e7eb;
        }

        .title {
            text-align: center;
            color: #172554;
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="title">
            نظام التنبؤ بالأرباح
        </div>

        <div class="subtitle">
            تسجيل الدخول إلى النظام
        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form action="/login" method="POST">

            <div class="form-group">

                <label>
                    اسم المستخدم
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="أدخل اسم المستخدم"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    كلمة المرور
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >

            </div>

            <button type="submit">
                تسجيل الدخول
            </button>

        </form>

        <div class="footer">
            مشروع تخرج – نظم المعلومات المحاسبية
        </div>

    </div>

</body>

</html>
